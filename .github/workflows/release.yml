name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v0.8.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: dist:win
            artifact: release-windows
            files: |
              app/dist/GUITinstal-*-Setup-x64.exe
              app/dist/GUITinstal-*-Portable-x64.exe
          - name: macOS
            os: macos-latest
            command: dist:mac
            artifact: release-macos
            files: app/dist/GUITinstal-*-mac-universal.dmg
          - name: Linux
            os: ubuntu-24.04
            command: dist:linux
            artifact: release-linux
            files: app/dist/GUITinstal-*-linux-x64.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "if ('v' + require('./app/package.json').version !== process.env.RELEASE_TAG) process.exit(1)"

      - if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64

      - run: npm ci
        working-directory: app

      - run: npm run check
        working-directory: app

      - run: npm run check:ai
        working-directory: app

      - run: npm run ${{ matrix.command }}
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Extract release notes from the changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v header="## [$version]" '
            $0 == header { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' app/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "GUITinstal $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --method PATCH \
            --field draft=false \
            --field prerelease=false >/dev/null
